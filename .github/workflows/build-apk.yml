name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN || secrets.EXPOTOKEN }}

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Link Expo project
        run: eas init --non-interactive --force

      - name: Build installable Android APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > build-result.json

      - name: Download APK
        run: |
          BUILD_URL=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('build-result.json','utf8')); const build=Array.isArray(data)?data[0]:data; const url=build?.artifacts?.buildUrl; if(!url) process.exit(1); process.stdout.write(url)")
          curl --fail --location "$BUILD_URL" --output Niyyah.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Niyyah-Android-APK
          path: Niyyah.apk
          if-no-files-found: error

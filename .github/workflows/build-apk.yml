name: Build Niyyah Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Niyyah
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Initialize EAS project
        run: eas init --non-interactive --force

      - name: Build installable APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > build-result.json

      - name: Download APK
        id: apk
        shell: bash
        run: |
          APK_URL=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('build-result.json','utf8'));const b=Array.isArray(j)?j[0]:j;process.stdout.write(b.artifacts.buildUrl)")
          curl --fail --location "$APK_URL" --output Niyyah.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Niyyah-Android-APK
          path: Niyyah.apk
          if-no-files-found: error
